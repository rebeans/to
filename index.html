<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>공항 버스노선 GPS 통합</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css">

    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ------------------------------
           상단 시간
        ------------------------------ */
        #currentTime {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;

            font-size: 60px;
            font-weight: bold;
            color: red;

            line-height: 1;
            text-shadow:
                1px 1px 2px white,
                -1px -1px 2px white,
                1px -1px 2px white,
                -1px 1px 2px white;

            pointer-events: none;
        }

        /* ------------------------------
           출발 설정
        ------------------------------ */
        #departurePanel {
            position: absolute;
            top: 80px;
            right: 10px;
            z-index: 1000;

            max-width: 95vw;

            background: rgba(255,255,255,0.95);
            padding: 8px;

            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        #departurePanelHeader {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #departurePanelToggle {
            flex: 0 0 auto;

            width: 30px;
            height: 30px;

            border: 0;
            border-radius: 6px;

            background: #e5e7eb;
            color: #333333;

            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #departurePanelBody {
            margin-top: 6px;
        }

        #departurePanel.collapsed #departurePanelBody {
            display: none;
        }

        #departurePanel.collapsed #routeInfo {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #departurePanel select {
            font-size: 18px;
            padding: 4px 6px;
            margin-right: 4px;
            margin-top: 4px;
        }

        #routeInfo {
            flex: 1 1 auto;
            min-width: 0;

            font-size: 20px;
            font-weight: bold;
        }

        #departureAlarmButton {
            width: 100%;
            margin-top: 7px;
            padding: 5px 8px;
            font-size: 14px;
            font-weight: bold;
            border: 0;
            border-radius: 6px;
            background: #808080;
            color: white;
            cursor: pointer;
        }

        #departureAlarmButton.on {
            background: #16a34a;
        }

        /* ------------------------------
           다음 정류장
        ------------------------------ */
        #scheduleResult {
            position: absolute;
            right: 10px;
            bottom: 20px;
            z-index: 1000;

            min-width: 350px;
            max-width: 95vw;

            background: rgba(255,255,255,0.95);
            padding: 10px 14px;

            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);

            font-size: 22px;
            font-weight: bold;
        }

        /* 이번 정류장(윗줄) / 다음 정류장(아랫줄) */
        #scheduleResult .line {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 4px 0;
            white-space: nowrap;
        }

        #scheduleResult .line + .line {
            border-top: 1px solid rgba(0,0,0,0.12);
        }

        #scheduleResult .tag {
            flex: 0 0 auto;

            padding: 2px 8px;
            border-radius: 6px;

            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        #scheduleResult .current .tag {
            background: #dc2626;
        }

        #scheduleResult .next .tag {
            background: #6b7280;
        }

        #scheduleResult .name {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #scheduleResult .current .name {
            font-size: 26px;
            color: #111111;
        }

        #scheduleResult .next .name {
            font-size: 26px;
            color: #444444;
        }

        #scheduleResult .eta {
            flex: 0 0 auto;
            font-size: 32px;
            color: #0052cc;
        }

        /* 다음 정류장 안내방송 버튼 */
        #stationAnnouncementButton {
            width: 100%;
            margin-top: 8px;
            padding: 6px 8px;
            font-size: 14px;
            font-weight: bold;
            border: 0;
            border-radius: 6px;
            background: #808080;
            color: white;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #stationAnnouncementButton.on {
            background: #16a34a;
        }


        /* ------------------------------
           현재 위치 버튼
        ------------------------------ */
        #gpsLocateButton {
            position: absolute;
            right: 10px;
            bottom: 210px;
            z-index: 1000;

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.96);
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);

            font-size: 40px;
            line-height: 46px;
            text-align: center;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #gpsLocateButton:active {
            transform: scale(0.94);
        }

        #gpsLocateButton.following {
            background: #e8f3ff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.5), 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ------------------------------
           정류장 라벨
        ------------------------------ */
        .station-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;

            color: black;
            font-size: 13px;
            font-weight: bold;

            text-shadow:
                1px 1px 0 white,
                -1px -1px 0 white,
                1px -1px 0 white,
                -1px 1px 0 white;

            white-space: nowrap;
        }

        .station-label:before {
            display: none !important;
        }

        /* Routing Machine UI 숨김 */
        .leaflet-routing-container {
            display: none !important;
        }

        /* GPS 현재 위치 - 형광색 두근두근 원형 */
        .gps-arrow {
            width: 30px;
            height: 30px;
            position: relative;
            transform-origin: center center;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
        }

        /* 두근거리는 바깥 테두리 */
        .gps-arrow::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(124, 252, 0, 0.75);
            box-sizing: border-box;
            animation: gpsPulse 1.5s ease-out infinite;
        }

        /* 실제 GPS 점 */
        .gps-arrow::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #7CFC00;
            border: 2px solid #ffffff;
            box-sizing: border-box;
            box-shadow:
                0 0 4px rgba(0, 0, 0, 0.6),
                0 0 8px rgba(124, 252, 0, 0.9);
            animation: gpsBeat 1.5s ease-in-out infinite;
        }

        /* GPS 위치가 두근두근 */
        @keyframes gpsBeat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            12% {
                transform: translate(-50%, -50%) scale(1.12);
            }

            24% {
                transform: translate(-50%, -50%) scale(1);
            }

            36% {
                transform: translate(-50%, -50%) scale(1.08);
            }

            48% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 바깥 링이 퍼지는 효과 */
        @keyframes gpsPulse {
            0% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(0.8);
            }

            70% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        /* 정류장 */
        .station-dot {
            width: 12px;
            height: 12px;

            background: #0066ff;
            border: 2px solid white;
            border-radius: 50%;

            box-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

    </style>
</head>

</div>

    </div>

</div>

<button id="gpsLocateButton" type="button" aria-label="현재 위치로 이동">⌾</button>

    /* ============================================================

    /* ============================================================
       03 / 04 노선 회차별 routeData 배정표
    ============================================================ */

    const ROUTE_ASSIGN_03 = {
        "새벽4": "early",   // T2 차고지 → 제2물류단지
        "새벽5": "04",      // 제2물류단지 → T2 차고지
        "주간1": "03",      // T2 차고지 → 제2물류단지
        "주간2": "04",      // 제2물류단지 → T2 차고지
        "주간3": "03",      // T2 차고지 → 제2물류단지
        "주간4": "04",      // 제2물류단지 → T2 차고지
        "주간5": "03",      // T2 차고지 → 제2물류단지
        "야간1": "03",      // T2 차고지 → 제2물류단지
        "야간2": "04",      // 제2물류단지 → T2 차고지
        "야간3": "03"       // T2 차고지 → 제2물류단지
    };

    const ROUTE_ASSIGN_04 = {
        "새벽1": "04",      // 제2물류단지 → T2 차고지
        "새벽2": "early",   // T2 차고지 → 제2물류단지
        "주간1": "04",      // 제2물류단지 → T2 차고지
        "주간2": "03",      // T2 차고지 → 제2물류단지
        "주간3": "04",      // 제2물류단지 → T2 차고지
        "주간4": "03",      // T2 차고지 → 제2물류단지
        "주간5": "04",      // 제2물류단지 → T2 차고지
        "야간1": "04",      // 제2물류단지 → T2 차고지
        "야간2": "03",      // T2 차고지 → 제2물류단지
        "야간3": "04"       // 제2물류단지 → T2 차고지
    };

    // "07:36(주간1)" → "주간1",  "22:20(야간3-화물if)" → "야간3"
    function getScheduleLabel(text) {
        const m = String(text).match(/\(([^)]*)\)/);
        if (!m) return '';
        return m[1].split('-')[0].trim();
    }

    function getRouteDataByKey(key) {
        if (key === 'early') return routeData_early;
        if (key === '04') return routeData_04;
        if (key === '03') return routeData_03;
        return null;
    }

    /* ============================================================
       소요시간 합계 / 도착시간 계산
    ============================================================ */

    function getRouteTotalMinutes(routeData) {
        if (!routeData || !routeData.length) return 0;
        return routeData.reduce(function(sum, p) {
            return sum + (Number(p.minutes) || 0);
        }, 0);
    }

    function addMinutesToTime(timeText, addMinutes) {
        const match = String(timeText).match(/^(\d{1,2}):(\d{2})/);
        if (!match) return '-';

        let total = Number(match[1]) * 60 + Number(match[2]) + Number(addMinutes || 0);
        total = ((total % 1440) + 1440) % 1440;

        const h = Math.floor(total / 60);
        const m = total % 60;

        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    // "출발지(T2 차고지)" → "T2 차고지", "제2물류단지" → "제2물류단지"
    function getStationShortName(title) {
        const m = String(title || '').match(/^[^(]*\(([^)]+)\)\s*$/);
        return (m ? m[1] : String(title || '')).trim();
    }

    function getRouteStartName(routeData) {
        if (!routeData || !routeData.length) return '-';
        return getStationShortName(routeData[0].title);
    }

    function getRouteEndName(routeData) {
        if (!routeData || !routeData.length) return '-';
        return getStationShortName(routeData[routeData.length - 1].title);
    }


    function getRouteName(routeData) {
    if (routeData === routeData_01) return "01 노선";
    if (routeData === routeData_via) return "정비 경유";
    if (routeData === routeData_early) return "장기 경유";
    if (routeData === routeData_04) return "04 노선";
    if (routeData === routeData_03) return "03 노선";
    if (routeData === routeData_05) return "05 노선";
    return "노선";
}


    /* ============================================================
       출발시간 목록 생성
    ============================================================ */

    function getCurrentSchedule() {
    const route = document.getElementById('routeSelect').value;
    const number = departureNumberSelect.value;

    if (route === '05') {
        const dayType = document.getElementById('dayType').value;
        return dayType === 'holiday'
            ? departureSchedules_05_holiday[number]
            : departureSchedules_05_workday[number];
    }

    if (route === '04') return departureSchedules_04[number];
    if (route === '03') return departureSchedules_03[number];
    if (route === '01') return departureSchedules_01[number];
    return departureSchedules_02[number];
}

function updateDepartureNumbers() {
    const route = document.getElementById('routeSelect').value;

    departureNumberSelect.innerHTML = '';

    let schedules = {};
    if (route === '05') {
        const dayType = document.getElementById('dayType').value;
        schedules = dayType === 'holiday'
            ? departureSchedules_05_holiday
            : departureSchedules_05_workday;
    } else if (route === '04') {
        schedules = departureSchedules_04;
    } else if (route === '03') {
        schedules = departureSchedules_03;
    } else if (route === '01') {
        schedules = departureSchedules_01;
    } else {
        schedules = departureSchedules_02;
    }

    Object.keys(schedules).forEach(function(number) {
        const option = document.createElement('option');
        option.value = number;
        option.textContent = number;
        departureNumberSelect.appendChild(option);
    });

    const savedNumber = localStorage.getItem('airportbus_' + route + '_number');

    if (savedNumber && schedules[savedNumber]) {
        departureNumberSelect.value = savedNumber;
    } else {
        departureNumberSelect.selectedIndex = 0;
    }

    updateDepartureTimes();
}

function updateDepartureTimes() {
    departureTimeSelect.innerHTML = '';

    const schedules = getCurrentSchedule();

    if (!schedules) return;

    schedules.forEach(function(time) {
        const option = document.createElement('option');

        const timeOnly =
            String(time).match(/^\d{1,2}:\d{2}/)?.[0] || String(time);

        option.value = timeOnly;
        option.textContent = time;

        departureTimeSelect.appendChild(option);
    });

    const nextTime = getNextDepartureTime(schedules);

    if (nextTime) {
        departureTimeSelect.value = nextTime;
    } else {
        departureTimeSelect.selectedIndex = 0;
    }

    onDepartureConfigChange();
}


    /* ============================================================
       현재 시간 이후 가장 가까운 출발시간 찾기
       ============================================================ */
    function getNextDepartureTime(schedules) {
        if (!schedules || schedules.length === 0) return null;

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        let nextTime = null;
        let nextMinutes = Infinity;

        schedules.forEach(function(timeText) {

            const match = String(timeText).match(/^(\d{1,2}):(\d{2})/);

            if (!match) return;

            const hour = Number(match[1]);
            const minute = Number(match[2]);

            const scheduleMinutes = hour * 60 + minute;

            // 현재 시각보다 큰 시간 중 가장 작은 시간 선택
            if (
                scheduleMinutes > currentMinutes &&
                scheduleMinutes < nextMinutes
            ) {
                nextMinutes = scheduleMinutes;

                // ★ option.value와 동일하게 시간 부분만 반환
                nextTime =
                    `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
            }
        });

        return nextTime;
    }


    /* ============================================================
       출발번호 + 시간 변경
    ============================================================ */

    /* 특정 노선(route)의 특정 회차(schedules[departureIndex], 시각 selectedTime)에
       실제로 배정되는 routeData를 계산한다 (부수효과 없음 - 전역 상태를 바꾸지 않음) */
    function resolveRouteDataForDeparture(route, schedules, departureIndex, selectedTime) {

        if (route === '01') {
            return routeData_01;
        }

        if (route === '02') {
            const [h, m] = selectedTime.split(':').map(Number);
            const total = h * 60 + m;

            const isVia =
                (total >= 6 * 60 + 41 && total <= 18 * 60 + 38) ||
                (total >= 0 && total <= 4 * 60);

            return isVia ? routeData_via : routeData_02;
        }

        if (route === '03' || route === '04') {

            const label = getScheduleLabel(schedules[departureIndex]);
            const assignTable = (route === '03') ? ROUTE_ASSIGN_03 : ROUTE_ASSIGN_04;

            let picked = getRouteDataByKey(assignTable[label]);

            if (!picked) {
                // 배정표에 없는 회차는 기본값으로 처리
                picked = (route === '03') ? routeData_03 : routeData_04;
            }

            return picked;
        }

        if (route === '05') {
            return routeData_05;
        }

        return null;
    }


    function onDepartureConfigChange() {
    const route = document.getElementById('routeSelect').value;
    const number = departureNumberSelect.value;
    const selectedTime = departureTimeSelect.value;
    const schedules = getCurrentSchedule();

    if (!schedules || !selectedTime) return;

    const departureIndex = schedules.findIndex(function(time) {
        const match = String(time).match(/^(\d{1,2}):(\d{2})/);
        if (!match) return false;

        const hour = String(match[1]).padStart(2, '0');
        const minute = match[2];
        return `${hour}:${minute}` === selectedTime;
    });

    if (departureIndex === -1) return;

    const resolved =
        resolveRouteDataForDeparture(route, schedules, departureIndex, selectedTime);

    if (resolved) {
        activeRouteData = resolved;
    }

    localStorage.setItem('airportbus_route', route);
    localStorage.setItem('airportbus_' + route + '_number', number);

    const totalMinutes = getRouteTotalMinutes(activeRouteData);
    const arrivalTime = addMinutesToTime(selectedTime, totalMinutes);
    const startName = getRouteStartName(activeRouteData);
    const endName = getRouteEndName(activeRouteData);

    routeInfo.textContent =
        `${route}번 / ${number} / ${selectedTime} 출발(${startName}) / ${getRouteName(activeRouteData)} / ${arrivalTime} 도착(${endName})`;

    renderRoute();

    resetAnnouncementState();

    updateScheduleResult();
}


    document.getElementById('routeSelect').addEventListener('change', function() {
    const route = this.value;

    document.getElementById('dayType').style.display =
        route === '05' ? '' : 'none';

document.getElementById('dayType').addEventListener('change', function() {
