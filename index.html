        updateDepartureNumbers();
    }
});

departureNumberSelect.addEventListener('change', function() {
    updateDepartureTimes();
});

departureTimeSelect.addEventListener('change', function() {
    onDepartureConfigChange();
});


    /* ============================================================
       노선 그리기
    ============================================================ */

    function renderRoute() {

        /* 기존 Routing Machine 제거 */
        routeSegments.forEach(function(segment) {
            try {
                map.removeControl(segment);
            } catch (e) {}
        });
        routeSegments = [];

        /* 기존 정류장 마커 제거 */
        stationMarkers.forEach(function(marker) {
            map.removeLayer(marker);
        });
        stationMarkers = [];

        /* 실제 OSRM geometry 초기화 */
        osrmRouteGeometries = [];

        /* 노선이 바뀌면 맵매칭 상태도 초기화 */
        resetRouteMatchingState();

        /* 이전 노선의 늦게 도착한 도로선 응답이 새 노선에 섞이지 않도록 표시 */
        const renderToken = ++routeRenderToken;

        /* 정류장 표시 */
        activeRouteData.forEach(function(point) {
            if (point.title === "경로지정좌표") {
                return;
            }

            const marker = L.marker(
                [point.lat, point.lng],
                { icon: stationIcon }
            ).addTo(map);

            marker.bindTooltip(
                point.title,
                {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -5],
                    className: 'station-label'
                }
            );

            stationMarkers.push(marker);
        });

        /* routeData의 각 연속 지점을 OSRM 자동차도로로 연결
           - 좌표 간 직선 연결 없음
           - 지도에는 Routing Machine이 받은 실제 OSM 도로선만 표시 */
        for (let i = 0; i < activeRouteData.length - 1; i++) {
            const from = activeRouteData[i];
            const to = activeRouteData[i + 1];
            const lineColor = to.routeType === "빨간색" ? "#dc2626" : "#0052cc";

            const control = L.Routing.control({
                waypoints: [
                    L.latLng(from.lat, from.lng),
                    L.latLng(to.lat, to.lng)
                ],

                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                }),

                lineOptions: {
                    styles: [{
                        color: lineColor,
                        opacity: 0.9,
                        weight: 6
                    }],
                    addWaypoints: false
                },

                addWaypoints: false,
                draggableWaypoints: false,
                routeWhileDragging: false,
                fitSelectedRoutes: false,
                showAlternatives: false,

                createMarker: function() {
                    return null;
                }
            });

            control.on('routesfound', function(e) {
                if (renderToken !== routeRenderToken) {
                    return;
                }

                if (e.routes && e.routes[0] && e.routes[0].coordinates) {
                    osrmRouteGeometries[i] = e.routes[0].coordinates.map(function(p) {
                        return { lat: p.lat, lng: p.lng };
                    });

                    /* 실제 도로선이 도착할 때마다 맵매칭용 경로를 다시 만든다 */
                    rebuildRoutePath();

                    updateScheduleResult();
                }
            });

            control.on('routingerror', function() {
                if (renderToken !== routeRenderToken) {
                    return;
                }

                console.warn('OSRM 경로 계산 실패: 구간 ' + i);

                /* 실패한 구간은 직선 임시경로로 계속 사용 */
                osrmFailed[i] = true;
                rebuildRoutePath();
                updateScheduleResult();
            });

            control.addTo(map);
            routeSegments.push(control);
        }

        /* OSRM 응답 전에도 동작하도록 직선 기반으로 먼저 구성 */
        rebuildRoutePath();
    }


    /* ============================================================
       시간 표시
    ============================================================ */

    /* ============================================================
       출발시간 음성 알람
       - 시간 선택값과 무관하게 현재 차량번호의 모든 시간표 감시
       - 차량번호를 변경하면 변경된 차량의 시간표를 감시
       ============================================================ */

    const departureAlarmButton =
        document.getElementById('departureAlarmButton');

    let departureAlarmEnabled = false;


    function speakDepartureAlarm(timeText) {

        const match =
            String(timeText).match(/^(\d{1,2}):(\d{2})/);

        if (!match) return;

        const hour = Number(match[1]);
        const minute = Number(match[2]);

        const text =
            `${String(hour).padStart(2, '0')}시 ${String(minute).padStart(2, '0')}분 출발 시간 입니다.`;

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = 'ko-KR';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);
    }


    function checkDepartureAlarm() {
    if (!departureAlarmEnabled) return;

    const schedules = getCurrentSchedule();
    if (!schedules) return;

    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const currentSecond = now.getSeconds();

    if (currentSecond !== 0) return;

    const currentTime =
        `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;

    const matched = schedules.find(function(time) {
        const timeOnly =
            String(time).match(/^(\d{1,2}:\d{2})/)?.[1];

        if (!timeOnly) return false;

        const [hour, minute] = timeOnly.split(':').map(Number);

        // 24:00 표기는 실제 시계의 00:00과 비교
        const normalizedTime =
            `${String(hour % 24).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;

        return normalizedTime === currentTime;
    });

    if (matched) {
        // 실제 출발시간이 되면 시간 드롭박스를 해당 출발시간으로 갱신
        departureTimeSelect.value = matched;

        // 기존 출발시간 변경 로직과 동일하게 화면/노선 설정 갱신
        onDepartureConfigChange();

        // 출발 알람
        speakDepartureAlarm(matched);
    }
}


    departureAlarmButton.addEventListener('click', function() {

        departureAlarmEnabled = !departureAlarmEnabled;

        if (departureAlarmEnabled) {

            departureAlarmButton.textContent = '🔊 출발 알람 ON';
            departureAlarmButton.classList.add('on');

            // 모바일 브라우저에서 TTS를 사용자 조작으로 먼저 활성화
            const testUtterance =
                new SpeechSynthesisUtterance('출발 알람을 켰습니다.');

            testUtterance.lang = 'ko-KR';
            testUtterance.rate = 0.85;
            testUtterance.pitch = 1.0;
            testUtterance.volume = 1.0;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(testUtterance);

        } else {

            departureAlarmButton.textContent = '🔊 출발 알람 OFF';
            departureAlarmButton.classList.remove('on');

            window.speechSynthesis.cancel();
        }


            /*
             * ON / OFF 상태 저장
             */

            localStorage.setItem(
                'airportbus_departure_alarm',
                departureAlarmEnabled
                    ? 'on'
                    : 'off'
            );

    });


    // 1초마다 출발시간 확인
    setInterval(checkDepartureAlarm, 1000);


    /* ============================================================
       GPS 자동 출발시간 선택
       - 시간 선택(select)은 항상 자유롭게 선택 가능 (이전 스케줄 확인 등)
       - 단, "현재위치 추적 모드"가 켜져 있고(gpsFollowMode),
         GPS 현재위치가 화면에 그려진 노선에 실제로 매칭되어
         "운행 중"으로 판단되는 동안에만, 출발 리스트의 각 출발시간과
         그 도착시간(총 소요시간 반영) 구간을 비교하여 현재시각이
         포함되는 출발시간을 자동으로 선택한다.
       - 추적 모드가 꺼져 있으면(대기 중 다른 스케줄 조회 등)
         GPS가 노선에 붙어 있어도 자동으로 값을 바꾸지 않는다.
       ============================================================ */

    // "HH:MM" 텍스트에서 시:분을 분단위 정수로 변환
    function parseTimeToMinutes(timeText) {
        const match = String(timeText).match(/^(\d{1,2}):(\d{2})/);
        if (!match) return null;
        return Number(match[1]) * 60 + Number(match[2]);
    }

    // now(분)가 [depMinutes, arriveMinutes) 구간에 포함되는지
    // 자정을 넘기는 심야 노선까지 고려해서 판단
    function isMinutesWithinWindow(nowMinutes, depMinutes, arriveMinutes) {

        if (nowMinutes >= depMinutes && nowMinutes < arriveMinutes) {
            return true;
        }

        // 출발이 자정 근처(심야)라 now가 다음날 새벽으로 넘어간 경우 보정
        if (
            nowMinutes + 1440 >= depMinutes &&
            nowMinutes + 1440 < arriveMinutes
        ) {
            return true;
        }

        return false;
    }

    // schedules 안에서 현재시각(nowMinutes)이 [출발~도착] 구간에 속하는
    // 출발시간의 인덱스를 찾는다. 없으면 -1
    function findActiveDepartureIndex(route, schedules, nowMinutes) {

        if (!schedules || !schedules.length) return -1;

        for (let i = 0; i < schedules.length; i++) {

            const depMinutes = parseTimeToMinutes(schedules[i]);
            if (depMinutes === null) continue;

            const timeOnly =
                `${String(Math.floor(depMinutes / 60)).padStart(2, '0')}:` +
                `${String(depMinutes % 60).padStart(2, '0')}`;

            const routeDataForThis =
                resolveRouteDataForDeparture(route, schedules, i, timeOnly);

            if (!routeDataForThis) continue;

            const totalMinutes = getRouteTotalMinutes(routeDataForThis);
            const arriveMinutes = depMinutes + totalMinutes;

            if (isMinutesWithinWindow(nowMinutes, depMinutes, arriveMinutes)) {
                return i;
            }
        }

        return -1;
    }

    function autoSelectDepartureTimeByGps() {

        // 현재위치 추적 모드일 때만 자동 선택
        // (추적 OFF 상태에서는 사용자가 고른 출발시간을 그대로 유지)
        if (!gpsFollowMode) return;

        // GPS가 화면의 노선에 실제로 매칭되어 있을 때만 자동 선택
        if (matchedProgress === null || !lastGpsPosition) return;

        const route = document.getElementById('routeSelect').value;
        const schedules = getCurrentSchedule();

        if (!schedules || !schedules.length) return;

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();

        const activeIndex =
            findActiveDepartureIndex(route, schedules, nowMinutes);

        if (activeIndex === -1) return;

        const depMinutes = parseTimeToMinutes(schedules[activeIndex]);
        if (depMinutes === null) return;

        const activeTime =
            `${String(Math.floor(depMinutes / 60)).padStart(2, '0')}:` +
            `${String(depMinutes % 60).padStart(2, '0')}`;

        // 이미 해당 출발시간이 선택되어 있으면 아무 것도 하지 않음
        if (departureTimeSelect.value === activeTime) return;

        departureTimeSelect.value = activeTime;
        onDepartureConfigChange();
    }

    // 1초마다 GPS 매칭 여부를 확인하여 필요할 때만 출발시간 자동 보정
    setInterval(autoSelectDepartureTimeByGps, 1000);


    function updateCurrentTime() {

        const now = new Date();

        const h =
            String(now.getHours()).padStart(2, '0');

        const m =
            String(now.getMinutes()).padStart(2, '0');

        const s =
            String(now.getSeconds()).padStart(2, '0');

        document.getElementById(
            'currentTime'
        ).textContent =
            `${h}:${m}:${s}`;

    }

    updateCurrentTime();

    setInterval(
        updateCurrentTime,
        1000
    );


    /* ============================================================
       GPS
       - navigator.geolocation으로 현재 위치 직접 수신
       - 진행방향 화살표 표시
       - GPS heading 우선, 없으면 실제 이동좌표로 방향 계산
       - 회색 이동 궤적 기록 없음
       - 현재 위치 버튼으로 지도 중심 이동
    ============================================================ */

    let currentLocationMarker = null;
    let gpsWatchId = null;
    let gpsFollowMode = false;
    let gpsPendingInitialZoom = false;  // 추적 ON 상태에서 첫 GPS를 받으면 지도를 확대해 이동

    const gpsLocateButton =
        document.getElementById('gpsLocateButton');

    function calculateBearing(a, b) {

        const lat1 =
            a.lat * Math.PI / 180;

        const lat2 =
            b.lat * Math.PI / 180;

        const dLon =
            (b.lng - a.lng) * Math.PI / 180;

        const y =
            Math.sin(dLon) * Math.cos(lat2);

        const x =
            Math.cos(lat1) * Math.sin(lat2) -
            Math.sin(lat1) * Math.cos(lat2) *
            Math.cos(dLon);

        return (
            Math.atan2(y, x) * 180 / Math.PI + 360
        ) % 360;
    }


    function updateGpsArrow() {

        if (!currentLocationMarker) {
            return;
        }

        const element =
            currentLocationMarker.getElement();

        if (!element) {
            return;
        }

        const arrow =
            element.querySelector('.gps-arrow');

        if (
            arrow &&
            Number.isFinite(currentGpsHeading)
        ) {

            arrow.style.transform =
                'rotate(' +
                currentGpsHeading +
                'deg)';

        }

    }


    /* ------------------------------------------------------------
       GPS 속도 / 진행방향 계산 (원본 GPS 기준 - 보정 결과와 섞지 않음)
       - 속도 : GPS 도플러 속도 우선, 없으면 이동거리/시간
       - 진행방향 : GPS heading 우선(주행 중일 때만), 없으면 실제 이동좌표
       ------------------------------------------------------------ */
    function updateGpsKinematics(coords, latlng, timestamp, accuracy) {

        const dt =
            lastFixTimestamp
                ? (timestamp - lastFixTimestamp) / 1000
                : 0;

        const moved =
            rawGpsPosition
                ? metersBetween(rawGpsPosition, latlng)
                : 0;

        const accOk =
            !Number.isFinite(accuracy) || accuracy <= 30;

        const noise =
            Math.max(6, (Number.isFinite(accuracy) ? accuracy : 10) * 1.5);

        /* 속도 */
        if (Number.isFinite(coords.speed) && coords.speed >= 0) {

            gpsSpeed = coords.speed;
            gpsSpeedIsDoppler = true;

        } else {

            gpsSpeedIsDoppler = false;

            if (dt >= 0.3 && dt <= 10) {
                /* 이동거리가 GPS 흔들림보다 충분히 클 때만 이동으로 인정 */
                gpsSpeed =
                    (accOk && moved >= noise)
                        ? Math.min(40, moved / dt)
                        : 0;
            }
        }

        /* 진행방향 */
        let heading = null;

        if (
            Number.isFinite(coords.heading) &&
            gpsSpeedIsDoppler &&
            gpsSpeed >= 1.5
        ) {
            heading = coords.heading;

        } else if (
            rawGpsPosition &&
            accOk &&
            dt > 0 && dt <= 10 &&
            moved >= Math.max(8, Number.isFinite(accuracy) ? accuracy : 10) &&
            moved / dt >= 2 &&
            moved / dt <= 40
        ) {
            /* 정차 중 미세한 흔들림은 방향으로 보지 않음 */
            heading = calculateBearing(rawGpsPosition, latlng);
        }

        /* 한 번의 GPS 튐으로 180도 뒤집히는 것은 무시 */
        updateStableHeading(heading, timestamp);
    }


    function processGpsPosition(position) {

        const coords = position.coords;

        const timestamp =
            position.timestamp || Date.now();

        /* 같은 시각 / 이전 시각 GPS가 다시 전달되면 무시 (중복 처리 방지) */
        if (lastFixTimestamp && timestamp <= lastFixTimestamp) {
            return;
        }

        const latlng =
            L.latLng(
                coords.latitude,
                coords.longitude
            );

        const accuracy = Number(coords.accuracy);


        /* ------------------------------------------------------------
           1) 속도 / 진행방향 결정 (원본 GPS 기준)
           ------------------------------------------------------------ */

        updateGpsKinematics(coords, latlng, timestamp, accuracy);

        const headingReliable =
            Number.isFinite(stableHeading) &&
            gpsSpeed !== null &&
            gpsSpeed >= MATCH_HEADING_MIN_SPEED &&
            (timestamp - stableHeadingTime) < 4000;

        previousRawGpsPosition = rawGpsPosition;
        rawGpsPosition = latlng;
        lastFixTimestamp = timestamp;

        const fix = {
            lat: latlng.lat,
            lng: latlng.lng,
            accuracy: accuracy,
            t: timestamp,
            speed: gpsSpeed,
            dop: gpsSpeedIsDoppler,
            heading: headingReliable ? stableHeading : null
        };

        recentFixes.push(fix);

        if (recentFixes.length > 4) {
            recentFixes.shift();
        }


        /* ------------------------------------------------------------
           2) GPS를 실제 노선(OSRM 도로선)에 붙임
              - 원본 GPS를 그대로 정류장 판단에 사용하지 않음
              - 직전 위치에서 노선 순방향으로 조금 앞선 구간만 후보로 삼음
              - 반경은 작게, 진행방향이 다른 도로선은 제외
              - 튄 GPS는 무시하고 기존 진행 위치를 유지
           ------------------------------------------------------------ */

        updateMatching(fix);


        /* 보정된 위치가 있으면 그것을 사용 (노선에 붙은 마커)
           오래 못 붙이면(노선 이탈) 원본 GPS 위치를 그대로 표시 */
        const showRaw =
            matchedPoint === null ||
            lostFixCount >= MATCH_OFFROUTE_FIXES;

        lastGpsPosition = showRaw ? latlng : matchedPoint;

        /* 화살표 방향 : 노선에 붙어 있으면 노선 진행방향(위치와 방향 일치) */
        if (!showRaw && Number.isFinite(matchedPathBearing)) {

            currentGpsHeading = matchedPathBearing;

        } else {

            currentGpsHeading =
                Number.isFinite(stableHeading)
                    ? stableHeading
                    : null;
        }


        /*
         * GPS 마커 생성/이동
         */
        if (!currentLocationMarker) {

            currentLocationMarker =
                L.marker(
                    lastGpsPosition,
                    {
                        icon: gpsIcon,
                        zIndexOffset: 1000
                    }
                ).addTo(map);

        } else {

            currentLocationMarker
                .setLatLng(lastGpsPosition);

        }

        /* 현재위치 추적 모드가 켜져 있을 때만 GPS를 따라 지도 중심 이동 */
        if (gpsFollowMode) {

            const zoom =
                gpsPendingInitialZoom
                    ? Math.max(map.getZoom(), 16)
                    : map.getZoom();

            gpsPendingInitialZoom = false;

            map.setView(
                lastGpsPosition,
                zoom,
                { animate: false }
            );
        }

        updateGpsArrow();
        updateScheduleResult();

    }


    function handleGpsError(error) {

        console.log(
            'GPS 오류:',
            error.message
        );

        /* 위치 권한이 거부되면 감시가 더 이상 동작하지 않으므로 추적 표시를 끈다.
           (타임아웃/일시적 신호 불량은 감시가 계속 재시도하므로 추적 유지) */
        if (error.code === 1) {

            stopGpsWatch();
            setGpsFollowMode(false);

        }

    }


    /*
     * GPS 감시 시작 / 중지
     * - 페이지 접속 시 바로 시작
     * - 다른 앱/탭에 갔다가 돌아오면(백그라운드에서 감시가 끊기는 경우 대비) 다시 시작
     */
    const GPS_WATCH_OPTIONS = {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
    };

    function stopGpsWatch() {

        if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
        }

    }

    function startGpsWatch() {

        if (!('geolocation' in navigator)) {

            console.log(
                '이 브라우저에서는 GPS를 지원하지 않습니다.'
            );

            return;
        }

        /* 이미 감시 중이어도 새로 시작해서 끊긴 감시를 되살림 */
        stopGpsWatch();

        gpsWatchId =
            navigator.geolocation.watchPosition(
                processGpsPosition,
                handleGpsError,
                GPS_WATCH_OPTIONS
            );

        /* watchPosition의 첫 응답이 늦을 수 있어 현재 위치를 한 번 더 바로 요청 */
        navigator.geolocation.getCurrentPosition(
            processGpsPosition,
            function() { /* 오류는 watchPosition의 handleGpsError가 처리 */ },
            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 15000
            }
        );

    }

    startGpsWatch();


    /*
     * 현재 위치 버튼 (ON/OFF 토글)
     * - 꺼져 있을 때 누르면 현재 위치 추적 ON
     * - 켜져 있을 때 누르면 현재 위치 추적 OFF
     * - 추적 ON: GPS가 갱신될 때마다 지도 중심을 현재 위치로 이동
     *            + 출발시간 자동 선택
     * - 사용자가 지도를 드래그하면 추적 OFF
     */
    function setGpsFollowMode(enabled) {

        gpsFollowMode = enabled;
        gpsLocateButton.classList.toggle('following', enabled);

        if (enabled && lastGpsPosition) {

            gpsPendingInitialZoom = false;

            map.setView(
                lastGpsPosition,
                Math.max(map.getZoom(), 16),
                { animate: true }
            );

        } else if (enabled) {

            /* 아직 위치를 못 받았으면 첫 GPS 수신 때 현재 위치로 확대 이동 */
            gpsPendingInitialZoom = true;

        }

        /* 추적 모드를 켜는 즉시 현재 운행 중인 출발시간으로 맞춤 */
        if (enabled) {
            autoSelectDepartureTimeByGps();
        }
    }


    gpsLocateButton.addEventListener(
        'click',
        function() {

            /* 이미 추적 중이면 버튼을 눌러 추적 OFF (토글) */
            if (gpsFollowMode) {
                setGpsFollowMode(false);
                return;
            }

            /* 추적 중이 아니면 현재 위치 추적 ON */
            setGpsFollowMode(true);

            /* 감시가 꺼져 있었다면(권한 거부 후 허용 등) 다시 시작 */
            if (gpsWatchId === null) {
                startGpsWatch();
            }

            if (lastGpsPosition) {
                return;
            }

            if (!('geolocation' in navigator)) {

                alert(
                    '이 브라우저에서는 GPS를 사용할 수 없습니다.'
                );

                setGpsFollowMode(false);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {

                    processGpsPosition(position);

                    /* 위치를 받아오는 동안 사용자가 OFF 했다면 다시 켜지 않음 */
                    if (gpsFollowMode) {
                        setGpsFollowMode(true);
                    }

                },
                function(error) {

                    console.log(
                        '현재 위치 요청 오류:',
                        error.message
                    );

                    setGpsFollowMode(false);

                    alert(
                        '현재 위치를 가져올 수 없습니다.\n' +
                        '브라우저의 위치 권한과 GPS가 켜져 있는지 확인해주세요.'
                    );

                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                }
            );

        }
    );


    /*
     * 사용자가 지도를 직접 드래그하면 자동 추적 해제
     * dragstart만 감지하므로 줌/버튼 조작에는 영향을 주지 않음
     */
    map.on('dragstart', function() {
        if (gpsFollowMode) {
            setGpsFollowMode(false);
        }
    });


    /* ============================================================
       지오메트리 / 각도 유틸
    ============================================================ */

    function metersBetween(a, b) {

        const latScale = 111320;

        const lonScale =
            111320 * Math.cos(((a.lat + b.lat) / 2) * Math.PI / 180);

        const dx = (a.lng - b.lng) * lonScale;
        const dy = (a.lat - b.lat) * latScale;

        return Math.hypot(dx, dy);
    }


    function getPointToSegmentInfo(p, a, b) {
        const latScale = 111320;
        const lonScale = 111320 * Math.cos(p.lat * Math.PI / 180);

        const px = p.lng * lonScale;
        const py = p.lat * latScale;
        const ax = a.lng * lonScale;
        const ay = a.lat * latScale;
        const bx = b.lng * lonScale;
        const by = b.lat * latScale;

        const dx = bx - ax;
        const dy = by - ay;
        const len2 = dx * dx + dy * dy;

        let t = 0;
        if (len2 > 0) {
            t = ((px - ax) * dx + (py - ay) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
        }

        const qx = ax + t * dx;
        const qy = ay + t * dy;
        const distance = Math.hypot(px - qx, py - qy);

        const bearing = calculateBearing(
            { lat: a.lat, lng: a.lng },
            { lat: b.lat, lng: b.lng }
        );

        return { distance, t, bearing };
    }


    function angleDifference(a, b) {
        let d = Math.abs(a - b) % 360;
        return d > 180 ? 360 - d : d;
    }


    function normalizeAngle(a) {
        return ((a % 360) + 360) % 360;
    }


    /* 두 방향을 최단 회전 방향으로 보간 */
    function blendAngle(from, to, weight) {
        const diff = ((to - from + 540) % 360) - 180;
        return normalizeAngle(from + diff * weight);
    }


    /* ============================================================
       진행방향 안정화
       - 한 번의 GPS 튐으로 방향이 180도 가까이 뒤집히는 것을 무시
       - 연속 2회 이상 같은 방향이 들어올 때만 반영
    ============================================================ */

    function updateStableHeading(rawHeading, timestamp) {

        if (!Number.isFinite(rawHeading)) {
            return;
        }

        const now = timestamp || Date.now();

        /* 방향 정보가 한동안 없었으면(정차 등) 이전 방향은 낡은 값 → 새 방향으로 바로 교체 */
        if (
            !Number.isFinite(stableHeading) ||
            now - stableHeadingTime > 4000
        ) {
            stableHeading = normalizeAngle(rawHeading);
            stableHeadingTime = now;
            headingFlipCount = 0;
            return;
        }

        const diff =
            angleDifference(stableHeading, rawHeading);

        if (diff > 120) {

            headingFlipCount++;

            /* 첫 번째 역방향은 GPS 튐으로 보고 무시 */
            if (headingFlipCount < 2) {
                return;
            }

            stableHeading = normalizeAngle(rawHeading);
            stableHeadingTime = now;
            headingFlipCount = 0;
            return;
        }

        headingFlipCount = 0;

        stableHeading =
            blendAngle(stableHeading, rawHeading, 0.6);

        stableHeadingTime = now;
    }


    /* ============================================================
       실제 노선(OSRM 도로선)을 하나의 경로로 연결
       - 각 점에 노선 시작점부터의 누적거리(dist)를 기록
       - 정류장별 누적거리(stationProgress)도 같이 계산
       - 도로선이 아직 안 온 구간은 직선으로 임시 연결(approx)
    ============================================================ */

    /* 실제 정류장 판단
       - '경로지정좌표' / 소요시간 0분인 임시 지점은 정류장이 아님
       - 첫 지점(출발 정류장)은 소요시간이 0분이지만 정류장으로 취급
         (출발 직후 "다음 정류장" 안내와 출발지 표시를 위해) */
    function isRealStation(point, index) {
        if (!point || point.title === '경로지정좌표') {
            return false;
        }

        return index === 0 || Number(point.minutes) > 0;
    }


    /* 모든 구간의 도로선이 도착했는지 (실패한 구간은 포기한 것으로 봄) */
    function geometryComplete() {

        if (!activeRouteData) {
            return false;
        }

        for (let i = 0; i < activeRouteData.length - 1; i++) {

            const g = osrmRouteGeometries[i];

            if (!(g && g.length >= 2) && !osrmFailed[i]) {
                return false;
            }
        }

        return true;
    }


    /* 진행거리가 속한 routeData 구간 번호 (stationProgress 기준) */
    function segmentIndexFromProgress(progress) {

        let ri = 0;

        for (let i = 0; i < stationProgress.length - 1; i++) {
            if (stationProgress[i] <= progress) {
                ri = i;
            } else {
                break;
            }
        }

        return Math.min(ri, stationProgress.length - 2);
    }


    /* routePath[j].dist <= progress <= routePath[j+1].dist 인 j */
    function findPathIndex(progress) {

        const last = routePath.length - 1;

        if (progress <= 0) {
            return 0;
        }

        if (progress >= routePath[last].dist) {
            return last - 1;
        }

        let lo = 0;
        let hi = last;

        while (hi - lo > 1) {

            const mid = (lo + hi) >> 1;

            if (routePath[mid].dist <= progress) {
                lo = mid;
            } else {
                hi = mid;
            }
        }

        return lo;
    }


    /* 노선 위 진행거리 지점의 좌표 / 진행방향 */
    function pointAtProgress(progress) {

        const j = findPathIndex(progress);

        const a = routePath[j];
        const b = routePath[j + 1];

        const len = b.dist - a.dist;

        const t =
            len > 0
                ? Math.min(1, Math.max(0, (progress - a.dist) / len))
                : 0;

        let bearing = null;

        if (Number.isFinite(a.bearing) && Number.isFinite(b.bearing)) {
            bearing = blendAngle(a.bearing, b.bearing, t);
        } else if (Number.isFinite(a.bearing)) {
            bearing = a.bearing;
        } else if (Number.isFinite(b.bearing)) {
            bearing = b.bearing;
        }

        return {
            lat: a.lat + (b.lat - a.lat) * t,
            lng: a.lng + (b.lng - a.lng) * t,
            bearing: bearing,
            routeIndex: a.routeIndex
        };
    }


    /* 각 점의 노선 진행방향 (앞뒤 12m 범위로 평활화 - 선분 하나의 들쭉날쭉한 방향 방지) */
    function computePathBearings() {

        const LOOK = 12;
        const n = routePath.length;

        for (let j = 0; j < n; j++) {

            let i0 = j;
            let i1 = j;

            while (i0 > 0 && routePath[j].dist - routePath[i0].dist < LOOK) {
                i0--;
            }

            while (i1 < n - 1 && routePath[i1].dist - routePath[j].dist < LOOK) {
                i1++;
            }

            let bearing = null;

            if (metersBetween(routePath[i0], routePath[i1]) >= 4) {
                bearing = calculateBearing(routePath[i0], routePath[i1]);
            } else if (j < n - 1) {
                bearing = calculateBearing(routePath[j], routePath[j + 1]);
            } else if (j > 0) {
                bearing = calculateBearing(routePath[j - 1], routePath[j]);
            }

            routePath[j].bearing = bearing;
        }
    }


    function setMatchedProgress(progress, timestamp) {

        progress = Math.min(totalRouteLength, Math.max(0, progress));

        const pt = pointAtProgress(progress);

        matchedProgress = progress;
        matchedPoint = L.latLng(pt.lat, pt.lng);
        matchedPathBearing = pt.bearing;
        matchedRouteIndex = pt.routeIndex;
        lastMatchTimestamp = timestamp;
    }


    function rebuildRoutePath() {

        if (!activeRouteData || activeRouteData.length < 2) {
            return;
        }

        /* 이전 진행 위치를 "구간 번호 + 구간 안 비율"로 기억해 둔다.
           (도로선이 도착해 구간 길이가 바뀌어도 같은 위치에 머물도록 - 위치를 처음부터 다시 찾지 않음) */
        let anchor = null;

        if (
            matchedProgress !== null &&
            stationProgress.length === activeRouteData.length
        ) {
            const ri = segmentIndexFromProgress(matchedProgress);
            const segLen = stationProgress[ri + 1] - stationProgress[ri];

            anchor = {
                ri: ri,
                frac: segLen > 0
                    ? Math.min(1, Math.max(0, (matchedProgress - stationProgress[ri]) / segLen))
                    : 0
            };
        }

        routePath = [];
        stationProgress = new Array(activeRouteData.length).fill(0);

        let cumulative = 0;

        for (let i = 0; i < activeRouteData.length - 1; i++) {

            const from = activeRouteData[i];
            const to = activeRouteData[i + 1];

            let geometry = osrmRouteGeometries[i];
            let approx = false;

            /* OSRM 응답 전이거나 실패한 구간은 직선으로 임시 연결 */
            if (!geometry || geometry.length < 2) {
                approx = true;
                geometry = [
                    { lat: from.lat, lng: from.lng },
                    { lat: to.lat, lng: to.lng }
                ];
            }

            stationProgress[i] = cumulative;

            for (let j = 0; j < geometry.length; j++) {

                const point = geometry[j];

                if (routePath.length === 0) {
                    routePath.push({
                        lat: point.lat,
                        lng: point.lng,
                        dist: 0,
                        routeIndex: i,
                        approx: approx,
                        bearing: null
                    });
                    continue;
                }

                const last = routePath[routePath.length - 1];
                const step = metersBetween(last, point);

                if (step < 0.5) {
                    continue;
                }

                cumulative += step;

                routePath.push({
                    lat: point.lat,
                    lng: point.lng,
                    dist: cumulative,
                    routeIndex: i,
                    approx: approx,
                    bearing: null
                });
            }
        }

        stationProgress[activeRouteData.length - 1] = cumulative;
        totalRouteLength = cumulative;

        if (routePath.length < 2) {
            matchedProgress = null;
            matchedPoint = null;
            matchedPathBearing = null;
            return;
        }

        computePathBearings();
        computeStationTriggerDistances();
        buildAnnouncementEvents();

        /* 기억해 둔 위치를 새 경로 기준으로 복원 */
        if (anchor) {
            const segLen = stationProgress[anchor.ri + 1] - stationProgress[anchor.ri];

            setMatchedProgress(
                stationProgress[anchor.ri] + anchor.frac * segLen,
                lastMatchTimestamp
            );
        }

        /* 직선 임시경로로 잠근 위치는, 실제 도로선이 다 오면 도로선 기준으로 다시 잠금 */
        if (
            matchedProgress !== null &&
            lockedOnApproxPath &&
            geometryComplete()
        ) {
            matchedProgress = null;
            matchedPoint = null;
            matchedPathBearing = null;
            lockedOnApproxPath = false;
            lostFixCount = 0;
        }

        if (matchedProgress === null) {
            lockToRoute();
        }

        if (matchedPoint !== null) {

            lastGpsPosition = matchedPoint;

            if (currentLocationMarker) {
                currentLocationMarker.setLatLng(matchedPoint);
            }

            if (Number.isFinite(matchedPathBearing)) {
                currentGpsHeading = matchedPathBearing;
                updateGpsArrow();
            }
        }
    }


    /* ============================================================
       정류장별 안내 기준거리 (도착 전 / 출발 후를 따로 계산)
       - 기본 : 50m
       - 앞(또는 뒤) 정류장과의 간격이 좁으면 : 15m
         (02번 장기탑승장3(남) ↔ 장기탑승장4(북) 처럼 40m 대 간격)
       - 정류장별 예외(STATION_DISTANCE_OVERRIDES)가 있으면 그 값을 우선 사용
       - 어떤 경우에도 해당 간격의 1/3 을 넘지 않음
         → "다음 정류장" 안내(출발 후)와 "이번 정류장" 안내(도착 전)가 겹치지 않음
    ============================================================ */

    function computeStationTriggerDistances() {

        stationArriveDistances =
            new Array(activeRouteData.length).fill(STATION_DISTANCE_DEFAULT);

        stationDepartDistances =
            new Array(activeRouteData.length).fill(STATION_DISTANCE_DEFAULT);

        realStationIndexes = [];

        for (let i = 0; i < activeRouteData.length; i++) {
            if (isRealStation(activeRouteData[i], i)) {
                realStationIndexes.push(i);
            }
        }

        const overrideTable =
            STATION_DISTANCE_OVERRIDES.get(activeRouteData);

        for (let k = 0; k < realStationIndexes.length; k++) {

            const index = realStationIndexes[k];

            const gapBefore =
                k > 0
                    ? stationProgress[index] - stationProgress[realStationIndexes[k - 1]]
                    : Infinity;

            const gapAfter =
                k < realStationIndexes.length - 1
                    ? stationProgress[realStationIndexes[k + 1]] - stationProgress[index]
                    : Infinity;

            const sideDistance = function(gap) {

                let distance = STATION_DISTANCE_DEFAULT;

                if (gap < STATION_CLOSE_GAP) {
                    distance = STATION_DISTANCE_CLOSE;
                }

                /* 정류장별 예외값이 있으면 우선 적용 */
                if (
                    overrideTable &&
                    Number.isFinite(overrideTable[activeRouteData[index].title])
                ) {
                    distance = overrideTable[activeRouteData[index].title];
                }

                /* 간격이 아주 좁으면 안내가 겹치지 않도록 더 줄임 */
                if (Number.isFinite(gap)) {
                    distance = Math.min(distance, Math.max(8, gap / 3));
                }

                return distance;
            };

            stationArriveDistances[index] = sideDistance(gapBefore);
            stationDepartDistances[index] = sideDistance(gapAfter);
        }
    }


    function getStationArriveDistance(index) {

        const value = stationArriveDistances[index];

        return Number.isFinite(value)
            ? value
            : STATION_DISTANCE_DEFAULT;
    }


    function getStationDepartDistance(index) {

        const value = stationDepartDistances[index];

        return Number.isFinite(value)
            ? value
            : STATION_DISTANCE_DEFAULT;
    }


    /* 안내방송 이벤트 목록 (노선 순방향 순서)
       정류장마다 : 도착 전 "이번 정류장" → 출발 후 "다음 정류장"(마지막 정류장은 출발 없음) */
    function buildAnnouncementEvents() {

        announceEvents = [];

        for (let k = 0; k < realStationIndexes.length; k++) {

            const index = realStationIndexes[k];

            announceEvents.push({
                type: 'arrive',
                k: k,
                index: index,
                at: stationProgress[index] - getStationArriveDistance(index)
            });

            if (k < realStationIndexes.length - 1) {
                announceEvents.push({
                    type: 'depart',
                    k: k,
                    index: index,
                    at: stationProgress[index] + getStationDepartDistance(index)
                });
            }
        }

        /* 지점이 겹치는 극단적인 경우에도 순서가 뒤바뀌지 않도록 */
        for (let e = 1; e < announceEvents.length; e++) {
            if (announceEvents[e].at < announceEvents[e - 1].at) {
                announceEvents[e].at = announceEvents[e - 1].at;
            }
        }
    }


    /* ============================================================
       GPS → 노선 맵매칭 (보정)

       [추적] 이미 노선에 붙어 있을 때
         - 직전 진행위치에서 "조금 뒤(20m) ~ 속도에 맞게 앞쪽" 구간만 후보
           → 가까이 붙은 다른 도로선(U턴 반대편, 평행 도로)은 후보에서 제외
         - 붙임 반경은 GPS 정확도에 맞춰 15~35m (기존 40~90m)
         - 속도가 있을 때 진행방향이 100° 이상 다른 선분은 제외
         - 진행위치는 줄어들지 않음(순방향), 정차 중에는 고정
         - 노선에서 벗어난(튄) GPS는 무시하고 기존 위치 유지
       [잠금] 처음 붙이거나 계속 놓쳤을 때 (노선 전체 탐색)
         - GPS 2회가 같은 위치를 가리킬 때만 확정 (GPS 한 번 튐으로 잠기지 않음)
         - 시작점=끝점인 순환노선은 출발시간표 기준 예상 위치로 구분
    ============================================================ */

    function getSnapRadius(accuracy) {

        const acc =
            (Number.isFinite(accuracy) && accuracy > 0)
                ? accuracy
                : 15;

        return Math.min(
            MATCH_SNAP_MAX,
            Math.max(
                MATCH_SNAP_MIN,
                acc * MATCH_SNAP_ACC_FACTOR + MATCH_SNAP_ACC_MARGIN
            )
        );
    }


    /* 선택된 출발시간 기준, 지금 노선 위 어디쯤 있어야 하는지 (출발 전이면 출발지)
       - 최초/재 잠금에서 "시작점=끝점" 같은 모호한 경우를 가르는 용도로만 약하게 사용 */
    function expectedProgressBySchedule() {

        if (!activeRouteData || !stationProgress.length) {
            return null;
        }

        const depMinutes =
            parseTimeToMinutes(departureTimeSelect.value);

        if (depMinutes === null) {
            return null;
        }

        const now = new Date();

        const nowMinutes =
            now.getHours() * 60 +
            now.getMinutes() +
            now.getSeconds() / 60;

        /* 출발 후 경과 분 (자정 넘김을 고려해 -12h ~ +12h 로 정규화) */
        let elapsed = nowMinutes - depMinutes;
        elapsed = (((elapsed + 720) % 1440) + 1440) % 1440 - 720;

        if (elapsed <= 0) {
            return 0;
        }

        const cumulative = [0];
        let sum = 0;

        for (let i = 1; i < activeRouteData.length; i++) {
            sum += Number(activeRouteData[i].minutes) || 0;
            cumulative.push(sum);
        }

        let lo = 0;

        for (let i = 0; i < cumulative.length; i++) {
            if (cumulative[i] <= elapsed) {
                lo = i;
            } else {
                break;
            }
        }

        if (lo >= cumulative.length - 1) {
            return totalRouteLength;
        }

        const span = cumulative[lo + 1] - cumulative[lo];

        const t =
            span > 0
                ? (elapsed - cumulative[lo]) / span
                : 0;

        return stationProgress[lo] +
            t * (stationProgress[lo + 1] - stationProgress[lo]);
    }


    /* 진행거리 [lo, hi] 범위의 선분 중 GPS에 가장 알맞은 지점을 찾는다 */
    function scoreCandidates(fix, lo, hi, opt) {

        let best = null;

        const startIndex =
            Number.isFinite(lo)
                ? findPathIndex(Math.max(0, lo))
                : 0;

        for (let j = startIndex; j < routePath.length - 1; j++) {

            const a = routePath[j];

            if (a.dist > hi) {
                break;
            }

            const b = routePath[j + 1];

            const info = getPointToSegmentInfo(fix, a, b);

            const radius =
                opt.radius *
                ((a.approx || b.approx) ? MATCH_APPROX_SCALE : 1);

            if (info.distance > radius) {
                continue;
            }

            const progress = a.dist + info.t * (b.dist - a.dist);

            if (progress < lo || progress > hi) {
                continue;
            }

            /* 점수 = GPS와 도로선 사이 거리(m) + 방향 차이 + 예상 위치와의 차이 (낮을수록 좋음) */
            let score = info.distance;

            let pathBearing = info.bearing;

            if (Number.isFinite(a.bearing) && Number.isFinite(b.bearing)) {
                pathBearing = blendAngle(a.bearing, b.bearing, info.t);
            }

            if (Number.isFinite(opt.heading)) {

                /* 선분 방향 / 평활화 방향 중 가까운 쪽 기준 (급커브에서 억울하게 제외되지 않게) */
                const diff =
                    Math.min(
                        angleDifference(opt.heading, info.bearing),
                        angleDifference(opt.heading, pathBearing)
                    );

                if (diff > MATCH_HEADING_LIMIT) {
                    continue;
                }

                score += diff * opt.headingWeight;
            }

            if (Number.isFinite(opt.expected)) {
                score += Math.abs(progress - opt.expected) * MATCH_PROGRESS_WEIGHT;
            }

            if (opt.extra) {
                score += opt.extra(progress);
            }

            if (!best || score < best.score) {

                best = {
                    progress: progress,
                    distance: info.distance,
                    bearing: pathBearing,
                    routeIndex: a.routeIndex,
                    score: score
                };
            }
        }

        return best;
    }


    /* [추적] 직전 위치에서 순방향으로 이어지는 구간에서만 찾는다 */
    function trackOnRoute(fix) {

        const speed =
            Number.isFinite(fix.speed) ? fix.speed : 8;

        /* 정차 : GPS 도플러 속도가 거의 0 */
        const stationary =
            fix.dop && fix.speed < MATCH_STATIONARY_SPEED;

        /* 마지막으로 위치가 확인된 후 경과시간 */
        const dt =
            Math.min(20, Math.max(0.5, (fix.t - lastMatchTimestamp) / 1000));

        /* 속도에 맞춰 앞쪽 탐색폭을 정함 (GPS 튐으로 멀리 점프하는 후보는 제외) */
        const windowSpeed =
            Math.min(MATCH_MAX_SPEED, Math.max(6, speed * 1.6 + 2));

        const lo = matchedProgress - MATCH_BACK_TOLERANCE;
        const hi = matchedProgress + windowSpeed * dt + MATCH_FORWARD_MARGIN;

        const expected =
            matchedProgress + (stationary ? 0 : speed) * dt;

        const radius = getSnapRadius(fix.accuracy);

        const best = scoreCandidates(fix, lo, hi, {
            radius: radius,
            heading: fix.heading,
            headingWeight: MATCH_HEADING_WEIGHT,
            expected: expected
        });

        if (!best) {
            return false;
        }

        /* GPS 튐 방어 : 속도로 예상한 위치보다 크게 앞선 후보는 한 번만으로 믿지 않고,
           다음 GPS도 같은 곳을 가리킬 때(실제로 그만큼 이동했을 때)만 인정한다.
           (진행거리는 줄어들지 않으므로, 튄 값을 한 번 받아들이면 되돌릴 수 없기 때문) */
        const jumpLimit =
            MATCH_JUMP_LIMIT + (fix.dop ? 0 : speed * dt * 0.5);

        if (best.progress - expected > jumpLimit) {

            const pending = pendingJump;

            const confirmed =
                pending !== null &&
                Math.abs(best.progress - pending.progress) <=
                    Math.max(15, speed * (fix.t - pending.t) / 1000 + 10);

            if (!confirmed) {
                pendingJump = { progress: best.progress, t: fix.t };
                return false;
            }
        }

        pendingJump = null;

        /* 버스는 노선을 거꾸로 가지 않음 → 진행거리는 줄어들지 않는다 */
        let progress = Math.max(matchedProgress, best.progress);

        /* 정차 중 GPS 흔들림으로 진행거리가 조금씩 늘어나지 않도록 고정 */
        if (
            stationary &&
            progress - matchedProgress < Math.max(12, radius)
        ) {
            progress = matchedProgress;
        }

        setMatchedProgress(progress, fix.t);

        return true;
    }


    /* [잠금] 노선 전체에서 후보를 찾는다 (최초 / 계속 놓쳤을 때) */
    function findLockCandidate(fix) {

        const expectedTime = expectedProgressBySchedule();

        /* 다시 잠그는 경우 : 직전 위치와 가까운 후보를 약하게 선호 */
        const reference = matchedProgress;

        const radius =
            Math.min(50, getSnapRadius(fix.accuracy) * MATCH_LOCK_RADIUS_SCALE);

        return scoreCandidates(fix, -Infinity, Infinity, {
            radius: radius,
            heading: fix.heading,
            headingWeight: MATCH_LOCK_HEADING_WEIGHT,
            expected: null,
            extra: function(progress) {

                let penalty = 0;

                if (expectedTime !== null) {
                    penalty += Math.min(
                        MATCH_TIME_CAP,
                        Math.abs(progress - expectedTime) * MATCH_TIME_WEIGHT
                    );
                }

                if (reference !== null) {
                    penalty += Math.min(
                        30,
                        Math.abs(progress - reference) * 0.01
                    );
                }

                return penalty;
            }
        });
    }


    function lockToRoute() {

        if (routePath.length < 2) {
            return false;
        }

        const fixes =
            recentFixes
                .filter(function(f) {
                    return !(f.accuracy > MATCH_ACCURACY_REJECT);
                })
                .slice(-MATCH_LOCK_CONFIRM_FIXES);

        if (fixes.length < MATCH_LOCK_CONFIRM_FIXES) {
            return false;
        }

        const candidates = fixes.map(findLockCandidate);

        if (candidates.some(function(c) { return !c; })) {
            return false;
        }

        /* 연속된 GPS가 노선 위 같은 위치를 가리키는지 확인 (GPS 한 번 튐으로 잠기지 않도록) */
        let consistent = true;

        for (let k = 1; k < candidates.length; k++) {

            const dtSec =
                Math.min(20, Math.max(0.5, (fixes[k].t - fixes[k - 1].t) / 1000));

            const speed =
                Number.isFinite(fixes[k].speed) ? fixes[k].speed : 8;

            const allowed =
                30 + Math.min(MATCH_MAX_SPEED, speed) * dtSec * 1.5;

            if (Math.abs(candidates[k].progress - candidates[k - 1].progress) > allowed) {
                consistent = false;
            }
        }

        if (!consistent) {

            lockConsistencyFails++;

            if (lockConsistencyFails < MATCH_LOCK_FORCE_FIXES) {
                return false;
            }
        }

        lockConsistencyFails = 0;
        pendingJump = null;

        const best = candidates[candidates.length - 1];

        setMatchedProgress(best.progress, fixes[fixes.length - 1].t);

        lostFixCount = 0;
        lockedOnApproxPath = !geometryComplete();

        /* 안내방송 위치를 조용히 다시 맞춤 (이미 지나간 안내를 한꺼번에 방송하지 않음) */
        resetAnnouncementState();

        return true;
    }


    function updateMatching(fix) {

        if (routePath.length < 2) {
            return;
        }

        /* 정확도가 너무 나쁜 GPS는 위치 판단에 쓰지 않음 (기존 위치 유지) */
        if (fix.accuracy > MATCH_ACCURACY_REJECT) {
            return;
        }

        if (matchedProgress === null) {
            lockToRoute();
            return;
        }

        if (trackOnRoute(fix)) {
            lostFixCount = 0;
            return;
        }

        /* 이번 GPS는 노선에 붙지 않음 → 기존 위치 유지, 계속 놓치면 전체에서 다시 잠금
           (종점에 도착해 있다가 다시 움직이면 새 회차 출발일 가능성이 높아 더 빨리 다시 잠금) */
        lostFixCount++;

        const relockFixes =
            matchedProgress >= totalRouteLength - MATCH_END_ZONE
                ? MATCH_END_RELOCK_FIXES
                : MATCH_LOST_RELOCK_FIXES;

        if (lostFixCount >= relockFixes) {
            lockToRoute();
        }
    }


    /* ============================================================
       이번 정류장 / 다음 정류장
       - 노선 위 진행거리(matchedProgress) 기준 (순방향으로만 증가)
       - 정류장을 "출발 후" 기준거리만큼 지나면 다음 정류장으로 전환
    ============================================================ */

    function getCurrentStationIndex() {

        if (matchedProgress === null || realStationIndexes.length === 0) {
            return -1;
        }

        for (let k = 0; k < realStationIndexes.length; k++) {

            const index = realStationIndexes[k];

            const departDistance =
                getStationDepartDistance(index);

            if (matchedProgress <= stationProgress[index] + departDistance) {
                return index;
            }
        }

        return -1;
    }


    function getFollowingStationIndex(currentIndex) {

        const position = realStationIndexes.indexOf(currentIndex);

        if (position === -1 || position + 1 >= realStationIndexes.length) {
            return -1;
        }

        return realStationIndexes[position + 1];
    }


        /* ============================================================
       다음 정류장 예정시간
    ============================================================ */

    /* ============================================================
       정류장 안내방송
       - 안내방송 ON일 때만 동작
       - 정류장 도착 50m 전 : "이번 정류장은 00 입니다."
       - 정류장 출발 50m 후 : "다음 정류장은 00 입니다."
       - 정류장 간격이 좁은 곳(01·02번 장기탑승장 등)은 간격에 맞춰 줄어든 거리 기준
       - 같은 안내는 한 번만, 노선 순방향 순서로만 방송
       - 판단 기준은 보정된(노선에 붙인) 위치의 진행거리
       ============================================================ */

    const stationAnnouncementButton =
        document.getElementById('stationAnnouncementButton');

    let stationAnnouncementEnabled = false;


    function speakStationAnnouncement(text) {

        if (!stationAnnouncementEnabled) return;

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = 'ko-KR';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        // 안내방송끼리 겹치지 않도록 이전 방송을 취소
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }


    stationAnnouncementButton.addEventListener('click', function() {

        stationAnnouncementEnabled =
            !stationAnnouncementEnabled;

        if (stationAnnouncementEnabled) {

            stationAnnouncementButton.textContent =
                '🔊 안내방송 ON';

            stationAnnouncementButton.classList.add('on');

            // 모바일 브라우저의 TTS를 사용자 조작으로 먼저 활성화
            const testUtterance =
                new SpeechSynthesisUtterance('안내방송을 켰습니다.');

            testUtterance.lang = 'ko-KR';
            testUtterance.rate = 0.85;
            testUtterance.pitch = 1.0;
            testUtterance.volume = 1.0;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(testUtterance);

        } else {

            stationAnnouncementButton.textContent =
                '🔊 안내방송 OFF';

            stationAnnouncementButton.classList.remove('on');

            window.speechSynthesis.cancel();
        }


            /*
             * ON / OFF 상태 저장
             */

            localStorage.setItem(
                'airportbus_station_announcement',
                stationAnnouncementEnabled
                    ? 'on'
                    : 'off'
            );
    });


    /* 해당 정류장의 예정 도착시각 */
    function getStationArrivalText(index) {

        const departureTime = departureTimeSelect.value;

        if (!departureTime || index < 0) {
            return '';
        }

        let totalMinutes = 0;

        for (let i = 1; i <= index; i++) {
            totalMinutes += Number(activeRouteData[i].minutes || 0);
        }

        const [hour, minute] =
            departureTime.split(':').map(Number);

        const arrival = new Date();

        arrival.setHours(hour, minute, 0, 0);
        arrival.setMinutes(arrival.getMinutes() + totalMinutes);

        const arrivalHour =
            String(arrival.getHours()).padStart(2, '0');

        const arrivalMinute =
            String(arrival.getMinutes()).padStart(2, '0');

        return arrivalHour + ':' + arrivalMinute;
    }


    /* 음성 안내용 도착시각 (예: "15시 30분", 정각이면 "9시 정각")
       - 출발시각이 선택되지 않아 시간이 없으면 빈 문자열 */
    function getStationArrivalSpeech(index) {

        const timeText = getStationArrivalText(index);

        if (!timeText) {
            return '';
        }

        const [hour, minute] =
            timeText.split(':').map(Number);

        return minute === 0
            ? `${hour}시 정각`
            : `${hour}시 ${minute}분`;
    }


    /* ------------------------------------------------------------
       안내방송 처리 (노선 경로 데이터 순방향 순서로만 진행)
       - 정류장마다 :  [도착 전 기준거리]  "이번 정류장은 00 입니다."
                    →  [출발 후 기준거리]  "다음 정류장은 00 입니다."
         (기준거리 기본 50m. 정류장 간격이 좁으면 줄어듦 - computeStationTriggerDistances)
       - 보정된(노선에 붙인) 위치의 진행거리가 해당 지점을 넘을 때만 방송
         → 진행거리는 줄어들지 않으므로 같은 안내가 반복되거나 되돌아가지 않음
       - GPS 공백/재잠금으로 여러 지점을 한꺼번에 넘은 경우 :
         지나간 안내는 건너뛰고 가장 마지막 안내 하나만 방송 (순서 뒤섞임 방지)
       - 회차 시작 / 위치를 처음(다시) 잠근 직후에는
         이미 지난 안내를 방송하지 않고 위치만 맞춤
       ------------------------------------------------------------ */

    function speakAnnouncementEvent(event) {

        if (event.type === 'arrive') {

            const index = event.index;

            /* GPS 공백 등으로 정류장을 이미 충분히 지나쳤다면 도착 안내는 생략 */
            if (
                matchedProgress >
                stationProgress[index] + getStationArriveDistance(index)
            ) {
                return;
            }

            speakStationAnnouncement(
                `이번 정류장은 ${activeRouteData[index].title} 입니다. ` +
                getStationArrivalSpeech(index)
            );

            return;
        }

        /* depart : 이번 정류장을 출발 후 기준거리만큼 지남 → 다음 정류장 안내 */
        const nextIndex = realStationIndexes[event.k + 1];

        if (nextIndex === undefined) {
            return;
        }

        speakStationAnnouncement(
            `다음 정류장은 ${activeRouteData[nextIndex].title} 입니다. ` +
            getStationArrivalSpeech(nextIndex)
        );
    }


    function handleStationAnnouncement() {

        if (matchedProgress === null || announceEvents.length === 0) {
            return;
        }

        /* 위치를 처음(다시) 잠근 직후 : 이미 지난 안내는 건너뛰고 위치만 맞춤 */
        if (announcePtr < 0) {

            let synced = 0;

            while (
                synced < announceEvents.length &&
                announceEvents[synced].at <= matchedProgress
            ) {
                synced++;
            }

            announcePtr = synced;
            return;
        }

        let due = announcePtr;

        while (
            due < announceEvents.length &&
            announceEvents[due].at <= matchedProgress
        ) {
            due++;
        }

        if (due === announcePtr) {
            return;
        }

        /* 순방향으로 지나간 안내들 중 가장 마지막 것만 방송 */
        const event = announceEvents[due - 1];

        announcePtr = due;

        speakAnnouncementEvent(event);
    }


    function updateScheduleResult() {

        const currentTextElement =
            document.getElementById('currentStationText');

        const currentEtaElement =
            document.getElementById('currentStationEta');

        const nextTextElement =
            document.getElementById('nextStationText');

        const nextEtaElement =
            document.getElementById('nextStationEta');

        if (!currentTextElement || !nextTextElement) {
            return;
        }


        if (!lastGpsPosition || matchedProgress === null) {

            currentTextElement.textContent = 'GPS 확인 중...';
            currentEtaElement.textContent = '';

            nextTextElement.textContent = '-';
            nextEtaElement.textContent = '';

            return;
        }


        const currentIndex = getCurrentStationIndex();

        if (currentIndex === -1) {

            currentTextElement.textContent = '운행 종료';
            currentEtaElement.textContent = '';

            nextTextElement.textContent = '-';
            nextEtaElement.textContent = '';

            return;
        }

        const nextIndex =
            getFollowingStationIndex(currentIndex);


        /* 안내방송 */
        handleStationAnnouncement();


        /* 이번 정류장 (윗줄) */
        currentTextElement.textContent =
            activeRouteData[currentIndex].title;

        currentEtaElement.textContent =
            getStationArrivalText(currentIndex);


        /* 다음 정류장 (아랫줄) */
        if (nextIndex === -1) {

            nextTextElement.textContent = '운행 종료';
            nextEtaElement.textContent = '';

        } else {

            nextTextElement.textContent =
                activeRouteData[nextIndex].title;

            nextEtaElement.textContent =
                getStationArrivalText(nextIndex);
        }
    }


    /* ============================================================
       저장된 출발 설정 복원
    ============================================================ */

    function initializeDepartureSelection() {
    const savedRoute = localStorage.getItem('airportbus_route');
    const routeSelect = document.getElementById('routeSelect');

    if (savedRoute && ['01', '02', '03', '04', '05'].includes(savedRoute)) {
        routeSelect.value = savedRoute;
    } else {
        routeSelect.value = '02';
    }

    const route = routeSelect.value;

    document.getElementById('dayType').style.display =
        route === '05' ? '' : 'none';

    if (route === '05') {
        const savedDayType =
            localStorage.getItem('airportbus_05_dayType');

        if (savedDayType === 'holiday' || savedDayType === 'workday') {
            document.getElementById('dayType').value = savedDayType;
        }
    }

    updateDepartureNumbers();

    const savedDepartureAlarm =
        localStorage.getItem('airportbus_departure_alarm');

    if (savedDepartureAlarm === 'on') {
        departureAlarmEnabled = true;
        departureAlarmButton.textContent = '🔊 출발 알람 ON';
        departureAlarmButton.classList.add('on');
    } else {
        departureAlarmEnabled = false;
        departureAlarmButton.textContent = '🔊 출발 알람 OFF';
        departureAlarmButton.classList.remove('on');
    }

    const savedStationAnnouncement =
        localStorage.getItem('airportbus_station_announcement');

    if (savedStationAnnouncement === 'on') {
        stationAnnouncementEnabled = true;
        stationAnnouncementButton.textContent = '🔊 안내방송 ON';
        stationAnnouncementButton.classList.add('on');
    } else {
        stationAnnouncementEnabled = false;
        stationAnnouncementButton.textContent = '🔊 안내방송 OFF';
        stationAnnouncementButton.classList.remove('on');
    }
}


    /* ============================================================
       초기 실행
    ============================================================ */

    initializeDepartureSelection();


    /* ============================================================
       현재위치 추적 자동 시작
       - 페이지 접속 시 버튼을 누르지 않아도 바로 추적 ON
       - 다른 앱/탭에 갔다가 돌아오거나, 화면을 껐다 켜거나,
         뒤로가기/앞으로가기로 페이지가 복원될 때도 다시 추적 ON
    ============================================================ */

    function resumeGpsTracking() {

        startGpsWatch();
        setGpsFollowMode(true);

    }

    /* 접속(새로고침 포함) 즉시 시작 */
    setGpsFollowMode(true);

    /* 다른 앱/탭 → 다시 이 페이지로 돌아왔을 때 */
    document.addEventListener('visibilitychange', function() {

        if (document.visibilityState === 'visible') {
            resumeGpsTracking();
        }

    });

    /* 브라우저 캐시(bfcache)에서 페이지가 복원됐을 때 */
    window.addEventListener('pageshow', function(event) {

        if (event.persisted) {
            resumeGpsTracking();
        }

    });


</script>
